[project]
name = "flower-chicken"
version = "2026.0.0"
description = "A really messy repo for trying out mkdocs and github actions"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    'tomli >= 1.1.0 ; python_version < "3.11"',
]

[project.optional-dependencies]
test = ["pytest", "ruff"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "mkdocs-click"]

[tool.ruff]
exclude = [".venv"]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true